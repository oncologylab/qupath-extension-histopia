name: Run gradle build

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

env:
  HISTOPIA_REF: fa4ad4ba06978325c0bf22f254c1eeec4789c47a

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned Histopia contract
        run: >-
          python -m pip install
          "histopia[qupath] @
          git+https://github.com/oncologylab/histopia.git@${HISTOPIA_REF}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        env:
          HISTOPIA_PYTHON: python
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qupath-extension-histopia
          path: build/libs/*.jar
          retention-days: 7
