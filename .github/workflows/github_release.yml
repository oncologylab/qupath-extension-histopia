name: Make draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create, for example v0.3.31
        required: true
        type: string

env:
  HISTOPIA_REF: 335773049c501fdc14ccb1b417e5c15b8ce80f4c

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned Histopia contract
        run: >-
          python -m pip install
          "histopia[qupath] @
          git+https://github.com/oncologylab/histopia.git@${HISTOPIA_REF}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        env:
          HISTOPIA_PYTHON: python
        run: ./gradlew build

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: qupath-extension-histopia-release
          path: build/libs/qupath-extension-histopia-0.3.31.jar
          retention-days: 7

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: qupath-extension-histopia-release

      - name: Validate tag and create checksum
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$RELEASE_TAG" = "v0.3.31"
          sha256sum qupath-extension-histopia-0.3.31.jar \
            > qupath-extension-histopia-0.3.31.jar.sha256

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --draft \
            --generate-notes \
            --title "Histopia for QuPath 0.3.31" \
            qupath-extension-histopia-0.3.31.jar \
            qupath-extension-histopia-0.3.31.jar.sha256
